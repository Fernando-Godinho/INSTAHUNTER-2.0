<div id="chat-messages-list" class="p-4" hx-get="{% url 'instances:chat_messages_only' contact.id %}" hx-trigger="every 5s" hx-swap="innerHTML">
    {% for msg in messages_list %}
        <div class="d-flex {% if msg.direction == 'OUT' %}justify-content-end{% else %}justify-content-start{% endif %} mb-3">
            <div class="message-bubble {% if msg.direction == 'OUT' %}sent{% else %}received{% endif %} shadow-sm" 
                 style="max-width: 75%; padding: 12px 16px; border-radius: 18px; 
                        {% if msg.direction == 'OUT' %}
                            background: #4f46e5;
                            color: white;
                            border-bottom-right-radius: 4px;
                        {% else %}
                            background: white;
                            color: #1e293b;
                            border-bottom-left-radius: 4px;
                            border: 1px solid #e2e8f0;
                        {% endif %}">
                <div class="message-text">
                    {{ msg.text_content|linebreaksbr }}
                </div>
                <div class="message-time text-end mt-1" style="font-size: 0.7rem; opacity: 0.7;">
                    {{ msg.created_at|date:"H:i" }}
                    {% if msg.direction == 'OUT' %}
                        <i class="bi bi-check2-all ms-1"></i>
                    {% endif %}
                </div>
            </div>
        </div>
    {% empty %}
        <div class="h-100 d-flex flex-column align-items-center justify-content-center text-center py-5 opacity-25">
            <i class="bi bi-chat-dots fs-1"></i>
            <p class="mt-2">Nenhuma mensagem disponível</p>
        </div>
    {% endfor %}
    <script>
        var container = document.getElementById('chat-scroll-area');
        if (container) {
            container.scrollTop = container.scrollHeight;
        }
    </script>
</div>
