<!-- Header do Chat -->
<div class="px-3 py-2 border-bottom border-white-10 d-flex align-items-center justify-content-between" style="min-height: 80px; background: rgba(255,255,255,0.2);">
    <div class="d-flex align-items-center gap-3">
        <div class="contact-avatar shadow-sm">
            {{ contact.name|slice:":1"|upper }}
        </div>
        <div>
            <h6 class="mb-0 fw-bold">{{ contact.name }}</h6>
            <small class="text-success d-flex align-items-center gap-1">
                <i class="bi bi-circle-fill" style="font-size: 0.5rem;"></i> Online
            </small>
        </div>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-link text-muted p-2 hover-bg-light"><i class="bi bi-telephone fs-5"></i></button>
        <button class="btn btn-link text-muted p-2 hover-bg-light"><i class="bi bi-three-dots-vertical fs-5"></i></button>
    </div>
</div>

<!-- Área de Mensagens -->
<div class="chat-scroll-area flex-grow-1" id="chat-scroll-area" style="background: rgba(0,0,0,0.05); min-height: 400px;">
    {% include 'instances/chat_messages_only_partial.html' %}
</div>

<!-- Input de Mensagem -->
<div class="chat-input-area border-top border-white-10">
    <form hx-post="{% url 'instances:chat_send_message' contact.id %}" 
          hx-target="#chat-content" 
          hx-on::after-request="this.reset()"
          class="d-flex gap-3 align-items-center">
        {% csrf_token %}
        <button type="button" class="btn btn-link text-muted p-0"><i class="bi bi-plus-circle fs-4"></i></button>
        <input type="text" name="message" class="form-control message-input" placeholder="Digite uma mensagem..." required autocomplete="off">
        <button type="submit" id="btn-send" class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
            <i class="bi bi-send-fill"></i>
        </button>
    </form>
</div>

<script>
    // Scroll para o fim ao carregar fragmento
    var container = document.getElementById('chat-scroll-area');
    if (container) {
        container.scrollTop = container.scrollHeight;
    }
</script>
