{% for contact in contacts %}
    <div class="contact-item d-flex align-items-center gap-3" 
         hx-get="{% url 'instances:chat_messages' contact.id %}" 
         hx-target="#chat-content"
         onclick="setActiveContact(this)">
        <div class="contact-avatar">
            {{ contact.name|slice:":1"|upper }}
        </div>
        <div class="flex-grow-1 overflow-hidden">
            <div class="d-flex justify-content-between align-items-center">
                <h6 class="mb-0 text-truncate">{{ contact.name }}</h6>
                <small class="text-muted" style="font-size: 0.7rem;">{{ contact.last_message_at|date:"H:i" }}</small>
            </div>
            <small class="text-muted text-truncate d-block">{{ contact.number }}</small>
        </div>
    </div>
{% empty %}
    <div class="text-center py-5">
        <p class="text-muted">Nenhum contato ainda</p>
    </div>
{% endfor %}
